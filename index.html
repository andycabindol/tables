<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andy's Grad Party Seating</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple-950: #3b0764;
      --purple-800: #5b21b6;
      --purple-700: #6d28d9;
      --purple-600: #7c3aed;
      --purple-500: #8b5cf6;
      --purple-400: #a78bfa;
      --purple-300: #c4b5fd;
      --purple-200: #ddd6fe;
      --purple-100: #ede9fe;
      --purple-50: #faf5ff;
      --text-muted: #7e6b9e;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: var(--purple-50);
      color: var(--purple-950);
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2.5rem 1.5rem 2rem;
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.75rem;
      color: var(--purple-800);
    }

    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      max-width: 36rem;
      margin: 0 auto;
      color: var(--text-muted);
    }

    .search-wrap {
      max-width: 22rem;
      margin: 1.5rem auto 0;
    }

    .search-field {
      position: relative;
    }

    .search-input {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--purple-300);
      border-radius: 12px;
      outline: none;
      color: var(--purple-950);
      background: #fff;
    }

    .search-field.has-text .search-input {
      padding-right: 2.75rem;
    }

    .search-input::-webkit-search-cancel-button {
      display: none;
    }

    .search-input::placeholder {
      color: var(--purple-400);
    }

    .search-input:focus {
      border-color: var(--purple-600);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }

    .search-clear {
      display: none;
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.35rem;
      height: 1.35rem;
      padding: 0;
      border: 1px solid var(--purple-300);
      border-radius: 50%;
      background: #fff;
      color: var(--purple-500);
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .search-field.has-text .search-clear {
      display: flex;
    }

    .search-clear:hover {
      border-color: var(--purple-500);
      color: var(--purple-700);
    }

    .search-clear svg {
      width: 0.55rem;
      height: 0.55rem;
    }

    main {
      max-width: 72rem;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }

    .tables {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      gap: 1.5rem;
    }

    .table-card {
      border: 1px solid var(--purple-200);
      border-radius: 12px;
      padding: 1.25rem 1.25rem 1rem;
      background: #fff;
    }

    .table-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--purple-800);
    }

    .table-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--purple-400);
    }

    .guest-list {
      list-style: none;
    }

    .guest-list li {
      padding: 0.2rem 0;
      font-size: 0.95rem;
    }

    .guest-list li.match {
      font-weight: 700;
      color: var(--purple-700);
    }

    .no-results {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
    }

    .status {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-muted);
    }

    .status.error {
      color: var(--purple-950);
      border: 1px solid var(--purple-300);
      max-width: 28rem;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #fff;
    }

    footer {
      text-align: center;
      padding: 1rem 1.5rem 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--purple-200);
    }

    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    @media (max-width: 480px) {
      .tables { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Andy's Grad Party!</h1>
    <p class="subtitle">Find your table named after meaningful locations during Andy's college years</p>
    <div class="search-wrap">
      <div class="search-field" id="search-field">
        <input type="search" id="search" class="search-input" placeholder="Search for your name" autocomplete="off" spellcheck="false">
        <button type="button" class="search-clear" id="search-clear" aria-label="Clear search">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M2 2l8 8M10 2L2 10"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="content" class="status">Loading seating chart…</div>
  </main>

  <footer id="footer">Built by Andy Cabindol</footer>

  <script>
    const SHEET_ID = '10keqGmpUrtdvzbjb1PCLuUjZ2PNv2ltm6lSEVnv1lu8';
    const REFRESH_MS = 30_000;
    let allTables = [];

    function matchesQuery(text, query) {
      return text.toLowerCase().includes(query.toLowerCase());
    }

    function getSearchQuery() {
      return document.getElementById('search').value.trim();
    }

    function updateSearchClear() {
      const field = document.getElementById('search-field');
      field.classList.toggle('has-text', document.getElementById('search').value.length > 0);
    }

    function clearSearch() {
      const input = document.getElementById('search');
      input.value = '';
      updateSearchClear();
      applySearch();
      input.focus();
    }

    function isGuestName(value) {
      if (value == null) return false;
      const text = String(value).trim();
      if (!text) return false;
      if (/^\d+$/.test(text)) return false;
      return true;
    }

    function toTitleCase(text) {
      return text.toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
    }

    function parseTableHeader(header) {
      const match = String(header).match(/^Table\s+(\d+)\s*-\s*(.+)$/i);
      if (match) {
        return {
          location: toTitleCase(match[2].trim()),
          number: match[1],
        };
      }
      return { location: header, number: '' };
    }

    function parseSheetData(data) {
      if (data.status !== 'ok' || !data.table) {
        throw new Error('Sheet returned an error');
      }

      const table = data.table;
      const headers = table.cols.map(col => col.label || '');

      return headers
        .map((header, colIndex) => {
          if (!header.trim()) return null;

          const guests = table.rows
            .map(row => row.c[colIndex]?.v)
            .filter(isGuestName);

          return { ...parseTableHeader(header), guests };
        })
        .filter(Boolean);
    }

    function fetchSheetData() {
      return new Promise((resolve, reject) => {
        const callbackName = `_sheetCb_${Date.now()}`;
        const script = document.createElement('script');

        const cleanup = () => {
          delete window[callbackName];
          script.remove();
        };

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('Could not load seating chart'));
        };

        script.src =
          `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
          `?tqx=out:json;responseHandler:${callbackName}` +
          `&headers=1&range=A1:I20&_=${Date.now()}`;

        document.head.appendChild(script);
      });
    }

    function renderTables(tables, query = '') {
      const visible = query
        ? tables.filter(table => table.guests.some(name => matchesQuery(name, query)))
        : tables;

      if (!visible.length) {
        document.getElementById('content').className = '';
        document.getElementById('content').innerHTML =
          `<p class="no-results">No matching names found.</p>`;
        return;
      }

      const html = `
        <div class="tables">
          ${visible.map(table => `
            <article class="table-card">
              <h2 class="table-title">${escapeHtml(table.location)} <span class="table-label">Table ${escapeHtml(table.number)}</span></h2>
              <ul class="guest-list">
                ${table.guests.map(name => {
                  const isMatch = query && matchesQuery(name, query);
                  return `<li${isMatch ? ' class="match"' : ''}>${escapeHtml(name)}</li>`;
                }).join('')}
              </ul>
            </article>
          `).join('')}
        </div>
      `;

      document.getElementById('content').className = '';
      document.getElementById('content').innerHTML = html;
    }

    function applySearch() {
      renderTables(allTables, getSearchQuery());
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showError(message) {
      const el = document.getElementById('content');
      el.className = 'status error';
      el.textContent = message;
    }

    async function loadSeating() {
      try {
        const data = await fetchSheetData();
        const tables = parseSheetData(data);

        if (!tables.length) throw new Error('No tables found in the sheet');
        allTables = tables;
        applySearch();
      } catch (err) {
        showError('Unable to load seating chart. Please try again in a moment.');
        console.error(err);
      }
    }

    document.getElementById('search').addEventListener('input', () => {
      updateSearchClear();
      applySearch();
    });
    document.getElementById('search-clear').addEventListener('click', clearSearch);

    function launchConfetti() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const canvas = document.createElement('canvas');
      canvas.id = 'confetti';
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      const resize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      resize();
      window.addEventListener('resize', resize);

      const colors = [
        '#3b0764', '#5b21b6', '#6d28d9', '#7c3aed',
        '#8b5cf6', '#a78bfa', '#c4b5fd', '#ddd6fe',
        '#9333ea', '#a855f7', '#d8b4fe', '#e9d5ff',
      ];
      const pieces = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: 6 + Math.random() * 6,
        h: 4 + Math.random() * 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.2,
        speed: 2 + Math.random() * 3,
        drift: (Math.random() - 0.5) * 1.5,
        opacity: 0.7 + Math.random() * 0.3,
      }));

      const duration = 3500;
      const start = performance.now();

      function frame(now) {
        const elapsed = now - start;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const p of pieces) {
          p.y += p.speed;
          p.x += p.drift;
          p.rotation += p.spin;

          if (elapsed > duration * 0.6) {
            p.opacity = Math.max(0, p.opacity - 0.02);
          }

          ctx.save();
          ctx.globalAlpha = p.opacity;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }

        const allDone = elapsed > duration && pieces.every(p => p.opacity <= 0 || p.y > canvas.height + 20);

        if (allDone) {
          window.removeEventListener('resize', resize);
          canvas.remove();
          return;
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    launchConfetti();

    loadSeating();
    setInterval(loadSeating, REFRESH_MS);
  </script>
</body>
</html>
